name: Motion checks (TEST data)

# Brief 22: the public site's motion, proved on each PR that touches it.
# The app runs on localhost against the same throwaway local Supabase
# stack the integration tests use, with TEST data, and
# scripts/motion/check.mjs loads the homepage three ways (reduced motion,
# no JavaScript, a slow phone), checks the rules in docs/motion.md and
# saves a 375px filmstrip of the motion as an artifact. It never touches
# the real database and isn't a required check.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lib/motion/**"
      - "app/_components/motion/**"
      - "app/layout.tsx"
      - "app/page.tsx"
      - "app/HomeHero.tsx"
      - "app/globals.css"
      - "app/_components/SiteHeader.tsx"
      - "app/_components/SiteNav.tsx"
      - "app/_components/BrandLogo.tsx"
      - "app/_components/OpenNowCards.tsx"
      - "app/_components/BusinessCarousel.tsx"
      - "app/_components/SectionGrid.tsx"
      - "app/_components/CategoryPage.tsx"
      - "app/[category]/**"
      - "app/_components/SiteFooter.tsx"
      - "app/_components/SubsectionPicker.tsx"
      - "app/_components/blocks/FeatureCard.tsx"
      - "app/weddings/page.tsx"
      - "app/pricing/**"
      - "app/about/**"
      - "app/apply/**"
      - "scripts/motion/**"
      - ".github/workflows/motion-checks.yml"

concurrency:
  group: motion-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      - name: Start local Supabase
        # The Supabase CLI pulls its images from public.ecr.aws, which at times
        # rate-limits GitHub's runners ("toomanyrequests"). When that happens
        # the same images are pulled from GitHub's own registry instead.
        run: |
          supabase start || {
            echo "The default image registry refused the pull; trying ghcr.io."
            supabase stop --no-backup || true
            SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io supabase start
          }
      - name: Export local Supabase credentials
        run: |
          supabase status -o env > supabase-status.env
          API_URL=$(grep -E '^(API_URL|SUPABASE_URL)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE_ROLE_KEY=$(grep -E '^(SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SECRET_KEY)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          ANON_KEY=$(grep -E '^(ANON_KEY|SUPABASE_ANON_KEY|PUBLISHABLE_KEY|SUPABASE_PUBLISHABLE_KEY)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          # The TEST platform owner seeded by seed-motion-fixture.ts (local stack
          # only), who saves the motion switch in Admin during the check.
          echo "PLATFORM_OWNER_EMAILS=test-delete-motion-admin@test.portpass.local" >> "$GITHUB_ENV"
      - name: Seed test data
        run: |
          npx tsx scripts/seed-test-data.ts
          npx tsx scripts/motion/seed-motion-fixture.ts
      - name: Build
        # One retry: next/font's Google Fonts fetch occasionally fails in CI
        # (a known upstream flake, see ci.yml).
        run: npx next build --webpack || npx next build --webpack
      - name: Start the app on localhost
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/ > /dev/null
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Check the motion
        run: node scripts/motion/check.mjs
      - name: Lighthouse (mobile) on / against this build
        # Brief 22: every motion PR reports Lighthouse mobile on / before and
        # after. This is the same audit as lighthouse.yml against this
        # branch's build on localhost, three runs, the median kept
        # (scripts/motion/lighthouse.mjs), so a part that moves / shows up
        # in report.md before it merges. Localhost reads a few points under
        # production (no CDN, a local database), so this step reports and
        # never blocks: the 85 floor is enforced on production by
        # lighthouse.yml after each merge, and a branch is judged against
        # main's run of this same job.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          mkdir -p motion-checks/lighthouse
          # The motion check's last section saves the switch in Admin off and
          # on again; if motion did not come back on, say so rather than pass
          # off a still homepage as this branch's.
          if ! curl -s http://localhost:3000/ | grep -o '<html[^>]*>' | grep -q 'data-motion="on"'; then
            echo "- NOTE: / is served with motion off (the switch was not restored), so the Lighthouse runs below measure a still page." >> motion-checks/report.md
          fi
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://localhost:3000/ --quiet --only-categories=performance \
              --form-factor=mobile --screenEmulation.mobile --screenEmulation.width=375 --screenEmulation.height=812 --screenEmulation.deviceScaleFactor=2 \
              --throttling-method=simulate --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path=motion-checks/lighthouse/run-$i.json
          done
          node scripts/motion/lighthouse.mjs motion-checks/lighthouse
      - name: Server log on failure
        if: failure()
        run: tail -n 80 next.log || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: motion-checks
          path: motion-checks/
          if-no-files-found: warn
      - name: Stop local Supabase
        if: always()
        run: supabase stop
