name: Billing rehearsal (TEST data)

# The growth plan's week-1 rehearsal (16 Oct 2026): PortPass's own billing
# chain played once end to end before the first real invoice. A TEST
# business gets a billing account, the daily job drafts its invoice, it is
# marked sent (once PortPass's TEST bank details are in), a part payment and
# the rest are recorded, and every state is checked. The invoice PDFs and
# 375px screenshots of Admin -> Billing are saved as the artifact.
#
# It runs the app on localhost against a throwaway local Supabase stack,
# with this run's own CRON_SECRET and no email key. The only address is
# @example.com, which lib/email.ts never emails. Not a required check: it
# takes as long as a build, so it runs when the billing code changes and by
# hand.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/e2e/billing-rehearsal.mjs"
      - ".github/workflows/billing-rehearsal.yml"
      - "lib/billing.ts"
      - "lib/billingInput.ts"
      - "lib/invoicePdf.ts"
      - "db/billing.ts"
      - "app/api/cron/daily/**"
      - "app/api/admin/billing/**"
      - "supabase/migrations/**billing**"

permissions:
  contents: read

concurrency:
  group: billing-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: latest
      - name: Start local Supabase
        run: |
          supabase start || {
            echo "The default image registry refused the pull; trying ghcr.io."
            supabase stop --no-backup || true
            SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io supabase start
          }
      - name: Export local Supabase credentials and this run's cron secret
        run: |
          supabase status -o env > supabase-status.env
          API_URL=$(grep -E '^(API_URL|SUPABASE_URL)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE_ROLE_KEY=$(grep -E '^(SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SECRET_KEY)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          ANON_KEY=$(grep -E '^(ANON_KEY|SUPABASE_ANON_KEY|PUBLISHABLE_KEY|SUPABASE_PUBLISHABLE_KEY)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          CRON=$(openssl rand -hex 24)
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$CRON"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON" >> "$GITHUB_ENV"
          # The TEST founder (local stack only).
          echo "PLATFORM_OWNER_EMAILS=test-delete-founder@test.portpass.local" >> "$GITHUB_ENV"
      - name: Seed test data
        run: npx tsx scripts/seed-test-data.ts
      - name: Build
        # One retry: next/font's Google Fonts fetch occasionally fails in CI
        # (a known upstream flake, see ci.yml).
        run: npx next build --webpack || npx next build --webpack
      - name: Start the app on localhost
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/login > /dev/null
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: The rehearsal
        shell: bash
        run: node scripts/e2e/billing-rehearsal.mjs | tee billing-rehearsal-log.txt
      - name: Result
        if: always()
        run: |
          if [ -f billing-rehearsal-result.md ]; then cat billing-rehearsal-result.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Server log on failure
        if: failure()
        run: tail -n 150 next.log || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: billing-rehearsal
          path: |
            screenshots/
            invoices/
            billing-rehearsal-result.md
            billing-rehearsal-log.txt
          if-no-files-found: warn
      - name: Stop local Supabase
        if: always()
        run: supabase stop
