name: Shop screenshots (TEST data)

# Drops (brief 15): the drop page, a buyer's receipt and the seller's
# reservation list at 375px. The seller's pages need a sign-in, so like the
# staff screenshot job this runs the app on localhost against a throwaway
# local Supabase stack with a TEST shop and a TEST owner that exist only in
# that stack, and saves the screenshots as an artifact. It never touches
# the real database and isn't a required check.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/shop/**"
      - "app/business/**/shop/**"
      - "db/shop.ts"
      - "lib/shop/**"
      - "scripts/screenshots/seed-shop-fixture.ts"
      - "scripts/screenshots/capture-shop.mjs"
      - ".github/workflows/shop-screenshots.yml"

concurrency:
  group: shop-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Export local Supabase credentials
        run: |
          supabase status -o env > supabase-status.env
          API_URL=$(grep -E '^(API_URL|SUPABASE_URL)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          SERVICE_ROLE_KEY=$(grep -E '^(SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY|SECRET_KEY|SUPABASE_SECRET_KEY)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          ANON_KEY=$(grep -E '^(ANON_KEY|SUPABASE_ANON_KEY|PUBLISHABLE_KEY|SUPABASE_PUBLISHABLE_KEY)=' supabase-status.env | head -1 | cut -d'=' -f2- | tr -d '"')
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SCREENSHOT_FIXTURE=$RUNNER_TEMP/shop-fixture.json" >> "$GITHUB_ENV"
      - name: Seed test data
        run: |
          npx tsx scripts/seed-test-data.ts
          npx tsx scripts/screenshots/seed-shop-fixture.ts
      - name: Build
        # One retry: next/font's Google Fonts fetch occasionally fails in CI
        # (a known upstream flake, see ci.yml).
        run: npx next build --webpack || npx next build --webpack
      - name: Start the app on localhost
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/shop/test-kit-shop > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/shop/test-kit-shop > /dev/null
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Capture
        run: node scripts/screenshots/capture-shop.mjs
      - name: Server log on failure
        if: failure()
        run: tail -n 80 next.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-screenshots
          path: screenshots/
          if-no-files-found: warn
      - name: Stop local Supabase
        if: always()
        run: supabase stop
